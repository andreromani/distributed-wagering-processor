x-application-environment: &application-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 3000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-wagering}
  POSTGRES_USER: ${POSTGRES_USER:-wagering}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  SQS_ENDPOINT: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
  SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
  SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
  SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
  HTTP_ENABLED: 'true'
  SQS_CONSUMER_ENABLED: 'true'
  OUTBOX_PUBLISHER_ENABLED: 'true'
  PENDING_REFERENCE_WORKER_ENABLED: 'true'
  WORKER_SHUTDOWN_TIMEOUT_MS: 30000

x-application: &application
  image: distributed-wagering-processor:local
  pull_policy: never
  environment: *application-environment
  depends_on:
    migrations:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
  stop_grace_period: 40s
  healthcheck:
    test: [CMD, bun, --eval, 'const r = await fetch("http://127.0.0.1:3000/health/ready", { signal: AbortSignal.timeout(8000) }); process.exit(r.ok ? 0 : 1)']
    interval: 15s
    timeout: 10s
    start_period: 20s
    retries: 10

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.14.0
    init: true
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: dynamic
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - ./docker/localstack/healthcheck.sh:/etc/localstack/healthcheck.sh:ro
    healthcheck:
      test: [CMD, sh, /etc/localstack/healthcheck.sh]
      interval: 10s
      timeout: 3s
      retries: 30
  migrations:
    image: distributed-wagering-processor:local
    build:
      context: .
    environment:
      <<: *application-environment
      INSTANCE_ID: migrations
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: [bun, ./node_modules/typeorm/cli.js, migration:run, -d, ./dist/infrastructure/database/data-source.js]
    restart: 'no'
  app-1:
    <<: *application
    environment:
      <<: *application-environment
      INSTANCE_ID: app-1
    ports:
      - "127.0.0.1:3001:3000"
  app-2:
    <<: *application
    environment:
      <<: *application-environment
      INSTANCE_ID: app-2
    ports:
      - "127.0.0.1:3002:3000"
  app-3:
    <<: *application
    environment:
      <<: *application-environment
      INSTANCE_ID: app-3
    ports:
      - "127.0.0.1:3003:3000"
volumes:
  postgres-data:
